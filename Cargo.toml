[package]
name = "red-beam"
version = "0.1.0"
edition = "2021"
description = "GPU-accelerated PDF viewer for large construction drawing sets (Windows)"

[[bin]]
name = "RedBeam"
path = "src/main.rs"

[dependencies]
windows-future = "0.3"
windows-numerics = "0.3"

[dependencies.windows]
version = "0.62"
features = [
    "Data_Pdf",
    "Foundation",
    "Storage",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Pdf",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
    "Web_Http",
    "Web_Http_Filters",
    "Web_Http_Headers",
]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
