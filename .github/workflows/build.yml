name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      # Baked into the exe; the in-app Update button compares it with the
      # latest release.
      REDBEAM_BUILD: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # PDFium (BSD-3-Clause) prebuilt by bblanchon/pdfium-binaries, pinned
      # and checksum-verified; build.rs embeds the DLL into RedBeam.exe.
      - name: Fetch PDFium
        shell: pwsh
        run: |
          $url = "https://github.com/bblanchon/pdfium-binaries/releases/download/chromium/8179/pdfium-win-x64.tgz"
          Invoke-WebRequest $url -OutFile pdfium.tgz
          $hash = (Get-FileHash pdfium.tgz -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne "836a77c9053f624839c66010cddea7b675628a36b8831d2330178bb169d241b6") { throw "PDFium checksum mismatch: $hash" }
          New-Item -ItemType Directory -Force vendor/pdfium | Out-Null
          tar -xzf pdfium.tgz -C vendor/pdfium
      - name: Lint
        run: cargo clippy --release -- -D warnings
      - name: Test
        run: cargo test --release
      - name: Build
        run: cargo build --release
      # Launch the real app (WARP renderer on the runner), step through the
      # main screens and save a screenshot of each. A crash, a panic or an
      # error dialog fails the build before it can be released.
      - name: Smoke test
        shell: pwsh
        timeout-minutes: 6
        run: |
          $p = Start-Process -FilePath target/release/RedBeam.exe -ArgumentList "--smoke","tests/sample-set.pdf","smoke-out" -PassThru -Wait
          if (Test-Path smoke-out/smoke.log) { Get-Content smoke-out/smoke.log }
          $crash = Join-Path $env:LOCALAPPDATA "Red-Beam/crash.log"
          if (Test-Path $crash) { Get-Content $crash; Copy-Item $crash smoke-out/ }
          if ($p.ExitCode -ne 0) { throw "Smoke test failed with exit code $($p.ExitCode)" }
      # Per-user install and uninstall (no admin): files, Start menu,
      # "Open with" registration and the Settings > Apps entry.
      - name: Install test
        shell: pwsh
        timeout-minutes: 3
        run: |
          $p = Start-Process -FilePath target/release/RedBeam.exe -ArgumentList "--install","--quiet" -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "install failed: $($p.ExitCode)" }
          $exe = Join-Path $env:LOCALAPPDATA "Programs/Red-Beam/RedBeam.exe"
          $lnk = Join-Path $env:APPDATA "Microsoft/Windows/Start Menu/Programs/Red-Beam.lnk"
          if (!(Test-Path $exe)) { throw "installed exe missing" }
          if (!(Test-Path $lnk)) { throw "Start menu shortcut missing" }
          $cmd = (Get-ItemProperty "HKCU:/Software/Classes/RedBeam.PDF/shell/open/command")."(default)"
          Write-Host "open command: $cmd"
          if ($cmd -notlike "*RedBeam.exe*%1*") { throw "PDF open command not registered" }
          $un = Get-ItemProperty "HKCU:/Software/Microsoft/Windows/CurrentVersion/Uninstall/Red-Beam"
          Write-Host "uninstall entry: $($un.DisplayName) $($un.DisplayVersion) -> $($un.UninstallString)"
          Get-ItemProperty "HKCU:/Software/Classes/.pdf/OpenWithProgids" | Out-String | Write-Host
          $p = Start-Process -FilePath $exe -ArgumentList "--uninstall","--quiet" -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "uninstall failed: $($p.ExitCode)" }
          for ($i = 0; $i -lt 20 -and (Test-Path $exe); $i++) { Start-Sleep -Seconds 1 }
          if (Test-Path $exe) { throw "installed exe still there after uninstall" }
          if (Test-Path $lnk) { throw "shortcut still there after uninstall" }
          if (Test-Path "HKCU:/Software/Classes/RedBeam.PDF") { throw "ProgID still registered" }
          if (Test-Path "HKCU:/Software/Microsoft/Windows/CurrentVersion/Uninstall/Red-Beam") { throw "uninstall entry still there" }
          Write-Host "install and uninstall OK"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-screenshots
          path: smoke-out/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: RedBeam-windows-x64
          path: target/release/RedBeam.exe
      # Every build of main becomes a release, which the app's Update button
      # downloads. The URL pattern is .../releases/download/build-<n>/RedBeam.exe
      - name: Publish release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Red-Beam build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: ${{ github.event.head_commit.message }}
          files: target/release/RedBeam.exe
