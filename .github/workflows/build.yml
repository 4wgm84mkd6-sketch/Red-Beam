name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      # Baked into the exe; the in-app Update button compares it with the
      # latest release.
      REDBEAM_BUILD: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Lint
        run: cargo clippy --release -- -D warnings
      - name: Build
        run: cargo build --release
      - uses: actions/upload-artifact@v4
        with:
          name: RedBeam-windows-x64
          path: target/release/RedBeam.exe
      # Every build of main becomes a release, which the app's Update button
      # downloads. The URL pattern is .../releases/download/build-<n>/RedBeam.exe
      - name: Publish release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Red-Beam build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: ${{ github.event.head_commit.message }}
          files: target/release/RedBeam.exe
